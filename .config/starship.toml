"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'

# Más margen para los módulos custom (evita el timeout de 500 ms por defecto)
command_timeout = 1000

# Entorno conda visible (lo gestiona Starship, no conda -> sin duplicar '(base)')
[conda]
format = '[$symbol$environment]($style) '
symbol = ' '
style = 'peach'
ignore_base = false

# Ocultar el módulo de Google Cloud (mostraba 'on ☁️ <email>')
[gcloud]
disabled = true

[git_branch]
symbol = ' '
style = 'mauve'

# Estado del repo: ✓ verde si el working tree está limpio, o 📝 N si hay N ficheros con
# cambios. Basado en 'git status' (rápido); NO en diff contra main (eso causaba el timeout).
[git_status]
disabled = true

[custom.git_clean]
description = 'Tick verde si no hay cambios sin commitear'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ -z "$(git status --porcelain 2>/dev/null)" ]'
command = 'echo ✓'
shell = ['bash', '--noprofile', '--norc']
format = '[$output](bold green) '

[custom.git_dirty]
description = 'Lápiz + nº de ficheros con cambios sin commitear'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ -n "$(git status --porcelain 2>/dev/null)" ]'
command = 'git status --porcelain 2>/dev/null | wc -l | tr -d " "'
shell = ['bash', '--noprofile', '--norc']
format = '[📝 $output](bold yellow) '

[directory]
style = 'blue'
truncation_length = 3
truncate_to_repo = true

[cmd_duration]
min_time = 300000   # solo muestra la duración si el comando tardó > 5 min
style = 'yellow'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
